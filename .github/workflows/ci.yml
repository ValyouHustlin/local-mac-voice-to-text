name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.1"
      - name: Run tests
        run: /usr/bin/xcrun swift test
      - name: Build release
        run: /usr/bin/xcrun swift build -c release
