name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: /usr/bin/xcrun swift test
      - name: Verify packaging safety guards
        run: /bin/bash scripts/test-packaging-guards.sh
      - name: Build release
        run: /usr/bin/xcrun swift build -c release
